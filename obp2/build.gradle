plugins {
    id 'application'
}

application {
    mainClass = 'obp2.ui2.PlugUI'
    applicationDefaultJvmArgs = [
        '-XX:+ExitOnOutOfMemoryError',
        '-Dapple.laf.useScreenMenuBar=true'
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

task createExtraRunApp(type: CreateStartScripts) {
    mainClass = 'obp2.cli.PlugCLI'
    classpath = startScripts.classpath
    outputDir = startScripts.outputDir
    applicationName = 'obp2-headless'
}

distributions {
    main {
        distributionBaseName = project.name
        contents {
            into('bin') {
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                from(createExtraRunApp)
                filePermissions {
                    unix(0755)
                }
            }
            from(project.file('dist')) {
                exclude '*.pyc'
                into '.'
            }
        }
    }
}

// jpackage task to create native macOS app bundle (requires JDK 14+)
tasks.register('jpackageMac', Exec) {
    dependsOn installDist
    
    def iconFile = file('icon/OBP2.icns')
    def appVersion = project.version.toString().replaceAll('[^0-9.]', '')
    if (appVersion.isEmpty()) appVersion = '2.0.0'
    
    def inputDir = layout.buildDirectory.dir('install/obp2/lib').get().asFile
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    
    doFirst {
        outputDir.mkdirs()
    }
    
    commandLine 'jpackage',
        '--type', 'app-image',
        '--name', 'OBP2',
        '--app-version', appVersion,
        '--input', inputDir.absolutePath,
        '--dest', outputDir.absolutePath,
        '--main-jar', "${project.name}-${project.version}.jar",
        '--main-class', 'obp2.ui2.PlugUI',
        '--java-options', '-XX:+ExitOnOutOfMemoryError',
        '--java-options', '-Dapple.laf.useScreenMenuBar=true',
        '--icon', iconFile.absolutePath,
        '--mac-package-name', 'OBP2'
    
    onlyIf { org.gradle.internal.os.OperatingSystem.current().isMacOsX() }
}

// Create DMG for macOS distribution
tasks.register('jpackageMacDmg', Exec) {
    dependsOn installDist
    
    def iconFile = file('icon/OBP2.icns')
    def appVersion = project.version.toString().replaceAll('[^0-9.]', '')
