dependencies {
    //UI support
    runtimeOnly 'org.obpcdl:obp2-GUI:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-CLI:2.0.0'
    //LTL support
    runtimeOnly 'org.obpcdl:LTL:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-runtime-buchi:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-runtime-buchikripke:2.0.0'
    //runtimes
    runtimeOnly 'org.obpcdl:obp2-runtime-remote:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-runtime-tlaplus:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-runtime-fiacre:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-runtime-lexplicit:2.0.0'
    runtimeOnly 'org.obpcdl:obp2-runtime-lstate_event:2.0.0'
}
