pluginManagement {
    plugins {
        id 'org.beryx.jlink' version '3.2.0'
        id 'org.openjfx.javafxplugin' version '0.1.0'
    }
}

include 'obp2-remote-headless' //supports only remote languages all platforms
include 'obp2-headless'         //headless version all platforms

include 'obp2' //GUI version all platforms - uses jlink/jpackage for native bundles
include 'obp2-simulator' //simulator GUI - uses jlink/jpackage for native bundles
include 'obp2-remote' //supports only remote languages - uses jlink/jpackage for native bundles
include 'obp2-oneway' //supports only bpmn2 for oneway - uses jlink/jpackage for native bundles

// include 'obp2-jpro' //experimental web interface

